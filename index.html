<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUX Selecta | Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fbf9f6;
            --card-bg: rgba(255, 255, 255, 0.92);
            --accent-gold: #c5a059;
            --accent-gold-hover: #a3813d;
            --accent-rose-gold: #c58b7e;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #eae1db;
            --wa-green: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); font-family: 'Montserrat', sans-serif; padding-bottom: 50px; }
        
        header { text-align: center; padding: 30px 20px; background: rgba(255, 255, 255, 0.85); border-bottom: 1px solid var(--border-color); }
        .logo-container { margin: 0 auto; width: 500px; height: 220px; display: flex; align-items: center; justify-content: center; }
        .logo-real { max-width: 100%; max-height: 100%; object-fit: contain; }
        .brand-title { font-family: 'Cinzel', serif; font-size: 3rem; letter-spacing: 8px; text-transform: uppercase; }
        .brand-subtitle { font-size: 0.78rem; letter-spacing: 4px; color: var(--accent-rose-gold); margin-bottom: 18px; }

        .nav-categories { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 16px; position: sticky; top: 0; background: rgba(255,255,255,0.95); z-index: 100; border-bottom: 1px solid var(--border-color); }
        .nav-btn { color: var(--text-primary); border: 1px solid var(--border-color); padding: 7px 18px; border-radius: 20px; font-size: 0.75rem; text-decoration: none; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .category-title { font-family: 'Cinzel', serif; font-size: 1.7rem; color: var(--accent-rose-gold); margin: 45px 0 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .product-card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .img-container { width: 100%; height: 250px; background-color: #faf6f5; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .product-info { padding: 18px; flex-grow: 1; }
        .product-name { font-size: 0.98rem; font-weight: 600; margin-bottom: 6px; }
        .product-price { color: var(--accent-gold); font-weight: 500; margin-bottom: 12px; }
        .btn-wa { display: block; text-align: center; background-color: var(--wa-green); color: #fff; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; }
        
        footer { text-align: center; margin-top: 60px; color: var(--text-secondary); font-size: 0.82rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="BRANDING/LOGO LUX.png" alt="LUX Selecta Logo" class="logo-real">
        </div>
        <h1 class="brand-title">LUX</h1>
        <p class="brand-subtitle">SELECTA | CURADURÍA & ESENCIA</p>
    </header>

    <nav class="nav-categories">
        <a href="#ROSTRO" class="nav-btn">ROSTRO</a>
        <a href="#LABIOS" class="nav-btn">LABIOS</a>
        <a href="#ACCESORIOS" class="nav-btn">ACCESORIOS</a>
        <a href="#PESTAÑAS" class="nav-btn">PESTAÑAS</a>
        <a href="#CORPORAL" class="nav-btn">CORPORAL</a>
        <a href="#OJOS" class="nav-btn">OJOS</a>
    </nav>

    <main class="container">
        <!-- Ejemplo de estructura de producto (Aplica esto para todos) -->
        <h2 id="ROSTRO" class="category-title">ROSTRO</h2>
        <div class="product-grid">
            <!-- Nuevo producto ejemplo -->
            <div class="product-card">
                <div class="img-container">
                    <img src="IMAGENES PRODUCTOS/Espuma Facial Hamamelis.jpg" alt="Espuma Facial Hamamelis" loading="lazy">
                </div>
                <div class="product-info">
                    <h3 class="product-name">Espuma Facial Hamamelis</h3>
                    <div class="product-price">$ 20.000</div>
                    <a href="https://wa.me/573153243483?text=Hola%20LUX!%20Me%20interesa%20la%20Espuma%20Facial%20Hamamelis." class="btn-wa">Pedir por WhatsApp</a>
                </div>
            </div>
            <!-- Repite este bloque para cada producto nuevo de tu lista -->
        </div>
    </main>

    <footer>
        <p>© 2026 <strong>LUX Selecta</strong>. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
